[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ATM"
version = "0.01"
description = "Local ATM simulation POC"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Ethan CHARLIER" }]

dependencies = [
    "pyopensky>=2.15",
    "pandas>=2.3",
    "keyring>=25.0",
    "python-dotenv>=1.0.1",
    "airportsdata>=20260315",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
atm-sim = "atm_sim.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atm_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=atm_sim --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
